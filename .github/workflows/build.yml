name: Build LocalBoard

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: LocalBoard (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            bundles: app,dmg
          - name: Windows
            os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # On macOS the Tauri build compiles llama.cpp's server (scripts/build-llama-server.sh, needs
      # CMake, Metal). On Windows it downloads the official prebuilt one (scripts/fetch-llama-server.ps1).
      - name: Tool versions
        shell: bash
        run: cmake --version | head -1 && rustc --version && node --version

      # SQLCipher builds OpenSSL from source; under `shell: bash` Git's MSYS perl wins on PATH and
      # lacks modules OpenSSL's Configure needs, so point openssl-src at the runner's Strawberry Perl.
      - name: Use Strawberry Perl for OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe" >> $env:GITHUB_ENV

      - run: npm ci

      - run: npx tsc --noEmit

      - name: Build app
        shell: bash
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: localboard-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
