[package]
name = "localboard"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "localboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time", "sync", "process", "fs", "io-util", "macros", "net", "rt"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking"] }
futures-util = "0.3"
duckdb = { version = "1", features = ["bundled"] }
calamine = "0.26"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "mysql", "sqlite"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
uuid = { version = "1", features = ["v4"] }
cron = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
tauri-plugin-deep-link = "2"
async-trait = "0.1"
sha2 = { version = "0.10", features = ["oid"] }
sysinfo = "0.37"
notify = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
sqlparser = { version = "0.63", features = ["visitor"] }
pdf-extract = "0.7"
docx-rs = "0.4"
rust_xlsxwriter = "0.99.1"
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls"] }
tokio-util = { version = "0.7", features = ["compat"] }
rsa = "0.9"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
